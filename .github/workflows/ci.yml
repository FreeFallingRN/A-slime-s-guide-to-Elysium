name: CI & Build Checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Data, Code & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies 🔧
        run: npm ci

      - name: Verify code style & formatting 💅
        run: npm run format:check

      - name: Svelte component & type diagnostics 🩺
        run: npm run check

      - name: Run data validation & regression tests 🧪
        run: npm test

      - name: Verify production build 📦
        run: npm run build
